<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="meta-build" content="20261120121928">
<meta name="theme-color" content="#3d6fb8">
<meta name="robots" content="noindex">
<title>みちゃﾏﾙ管理</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../assets/icon-admin-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout idea: 空色グラデの一枚スクロール。パールとリボンで区切り、イラストを主役にする */
:root{
  --sky:#9ad4f2;
  --blue:#5b8be0;
  --white:#ffffff;
  --ink:#2c4a7a;
  --mist:#eaf6fd;
  --ribbon:#8db6f7;
  --pink:#ff9fc2;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:clip;overscroll-behavior-x:none;max-width:100%}
body{
  word-break:auto-phrase;line-break:strict;text-wrap:pretty;
  margin:0;font-family:var(--font-body);color:var(--ink);line-height:1.8;
  background:linear-gradient(180deg,var(--sky) 0%,#c9e8f8 38%,var(--white) 75%);
  background-attachment:fixed;background-color:var(--mist);
  overflow-x:clip;overscroll-behavior-x:none;max-width:100%;position:relative;
}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.ph{display:inline-block}
h2,.catch{text-wrap:balance}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* sparkles */
.sp{position:absolute;width:var(--s,14px);height:var(--s,14px);background:#fff;pointer-events:none;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  animation:tw 3.2s ease-in-out infinite;animation-delay:var(--d,0s);opacity:.9}
@keyframes tw{0%,100%{transform:scale(.55) rotate(0);opacity:.35}50%{transform:scale(1) rotate(25deg);opacity:1}}

/* opening */
#opening{position:fixed;inset:0;z-index:50;overflow:hidden;color:var(--white);cursor:pointer;
  background:radial-gradient(circle at 50% 42%,#d6eefc 0%,var(--sky) 48%,var(--blue) 100%);}
#opening{transition:opacity .7s ease}
#opening.out{opacity:0;pointer-events:none}
#opening.gone{display:none}
#opening .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 20px}
#opening .olw{margin-bottom:-6px;z-index:4;position:relative;animation:logoIn 1.2s cubic-bezier(.2,1.2,.4,1) .2s both}
#opening .ologo{display:block;width:min(300px,78vw);height:auto;filter:drop-shadow(0 2px 8px rgba(255,255,255,.9));animation:float 3.4s ease-in-out 1.6s infinite}
#opening .halo{animation:float 3s ease-in-out 2.7s infinite;margin-bottom:88px;position:relative;width:min(250px,64vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
#opening .ocl{position:absolute;left:50%;bottom:-100px;width:150%;margin-left:-75%;aspect-ratio:2.1;background:url(../assets/cloud-soft.svg) center/100% 100% no-repeat;z-index:0;opacity:0;filter:drop-shadow(0 6px 10px rgba(60,100,190,.35));animation:cIn .9s cubic-bezier(.3,1.4,.5,1) 1.7s both}
@keyframes cIn{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
#opening .bear{position:relative;z-index:1;width:100%;height:auto;opacity:0;animation:charIn 1.1s cubic-bezier(.2,1.4,.4,1) 1.5s both;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.85)) drop-shadow(0 6px 12px rgba(60,100,190,.3))}
#opening .catch2{margin:6px 0 0;text-align:center;font-weight:700;font-size:17px;line-height:1.6;letter-spacing:.06em;text-shadow:0 2px 10px rgba(50,90,190,.55);animation:rise2 .9s ease 2.7s both}
#opening .sub{margin:0;font-size:12px;letter-spacing:.34em;opacity:.95;animation:rise2 .9s ease 3.3s both}
#opening .skip{margin:10px 0 0;font-size:12px;letter-spacing:.12em;animation:rise2 .6s ease 3.9s both,blink 1.8s ease-in-out 4.5s infinite}
#opening .cu{position:absolute;top:50%;width:300px;height:300px;margin-top:-150px;background:url(../assets/cloud-soft.svg) center/contain no-repeat;z-index:3;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(91,139,224,.3))}
#opening .cu.l1{left:-140px;margin-top:-290px;animation:cuL 1.6s cubic-bezier(.6,0,.3,1) .9s forwards}
#opening .cu.l2{left:-90px;animation:cuL 1.6s cubic-bezier(.6,0,.3,1) 1s forwards}
#opening .cu.l3{left:-150px;margin-top:-10px;animation:cuL 1.6s cubic-bezier(.6,0,.3,1) 1.1s forwards}
#opening .cu.r1{right:-140px;margin-top:-270px;animation:cuR 1.6s cubic-bezier(.6,0,.3,1) .95s forwards}
#opening .cu.r2{right:-90px;animation:cuR 1.6s cubic-bezier(.6,0,.3,1) 1.05s forwards}
#opening .cu.r3{right:-150px;margin-top:-20px;animation:cuR 1.6s cubic-bezier(.6,0,.3,1) 1.15s forwards}
#opening .cu.m{left:50%;margin-left:-150px;width:300px;animation:cuM 1.1s ease .8s forwards}
@keyframes cuL{from{transform:translateX(120px) scale(1.5)}to{transform:translateX(-120%) scale(1.5)}}
@keyframes cuR{from{transform:translateX(-120px) scale(1.5)}to{transform:translateX(120%) scale(1.5)}}
@keyframes cuM{from{transform:scale(1.8);opacity:1}to{transform:scale(2.6) translateY(-30px);opacity:0}}
@keyframes logoIn{from{opacity:0;transform:translateY(16px) scale(.8)}to{opacity:1;transform:none}}
@keyframes charIn{from{opacity:0;transform:scale(.4) translateY(30px)}to{opacity:1;transform:none}}
@keyframes ring{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(1.5)}}
@keyframes bowIn{from{opacity:0;transform:translateY(-40px) rotate(-30deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes bowT{50%{transform:rotate(8deg) scale(1.06)}}
@keyframes blink{50%{opacity:.35}}
@keyframes openFade{to{opacity:0;visibility:hidden}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes rise2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* hero */
header.hero{padding:34px 0 20px;text-align:center;position:relative;overflow:hidden}
.ride{position:relative;width:min(300px,78vw);margin:0 auto 84px;animation:bob 5s ease-in-out infinite}
.ride .mycloud{position:absolute;left:50%;bottom:-100px;width:150%;margin-left:-75%;aspect-ratio:2.1;background:url(../assets/cloud-soft.svg) center/100% 100% no-repeat;pointer-events:none;z-index:0;filter:drop-shadow(0 6px 10px rgba(91,139,224,.3))}
@keyframes cfl{50%{transform:translateY(5px) scale(1.03)}}
.char{position:relative;z-index:1;display:block;width:100%;height:auto;margin:0 auto;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.85)) drop-shadow(0 6px 14px rgba(70,110,190,.25))}
.logo{display:block;width:min(360px,90%);height:auto;margin:-6px auto 0;filter:drop-shadow(0 4px 10px rgba(70,110,190,.22));animation:glow 4.5s ease-in-out infinite}
.catch{font-weight:700;font-size:clamp(16px,4.6vw,19px);letter-spacing:.06em;color:#3f68b8;text-shadow:0 0 10px rgba(255,255,255,.9);margin:16px 0 4px;line-height:1.6}
.hero p.lead{margin:0 auto;max-width:30em;font-weight:500;font-size:14px;padding:0 18px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{background:rgba(255,255,255,.85);border-radius:999px;padding:2px 14px;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--blue);border:1px solid #d8ecf8}
.cloud{position:absolute;pointer-events:none;opacity:.9;z-index:0}
.pearls{height:18px;margin:0 0 6px;background:radial-gradient(circle at 50% 50%,#fff 0 5.5px,rgba(255,255,255,.55) 6px 7px,transparent 7.5px) 0 0/20px 18px repeat-x}

nav.tabs{position:sticky;top:0;z-index:20;padding:2px 0 4px;background:rgba(234,246,253,.9);backdrop-filter:blur(8px);border-bottom:1px solid #d8ecf8}
nav.tabs .wrap{display:flex;gap:8px;padding-top:2px;padding-bottom:2px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
nav.tabs a{position:relative;isolation:isolate;flex:0 0 auto;width:88px;height:63px;text-decoration:none;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:7px 0 0;text-align:center;color:var(--blue);transition:transform .2s;white-space:nowrap}
nav.tabs a::before{content:"";position:absolute;inset:0;z-index:-1;background:url(../assets/tab-cloud.svg) center/100% 100% no-repeat;filter:drop-shadow(0 2px 3px rgba(91,139,224,.25));transition:filter .2s}
nav.tabs .ar{position:absolute;top:50%;margin-top:-17px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--blue);font-size:20px;font-weight:700;line-height:1;box-shadow:0 2px 8px rgba(91,139,224,.35);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:center;justify-content:center;padding:0 0 2px}
nav.tabs .ar.show{opacity:1;pointer-events:auto}
nav.tabs .ar.l{left:4px}nav.tabs .ar.r{right:4px;animation:arn 1.4s ease-in-out infinite}
nav.tabs::before,nav.tabs::after{content:"";position:absolute;top:0;bottom:0;width:36px;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s}
nav.tabs::before{left:0;background:linear-gradient(90deg,rgba(234,246,253,.95),rgba(234,246,253,0))}
nav.tabs::after{right:0;background:linear-gradient(270deg,rgba(234,246,253,.95),rgba(234,246,253,0))}
nav.tabs.cl::before,nav.tabs.cr::after{opacity:1}
@keyframes arn{50%{transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){nav.tabs .ar.r{animation:none}}
nav.tabs a:hover{transform:translateY(-2px)}
nav.tabs a.on{color:var(--white);text-shadow:0 1px 3px rgba(30,70,170,.7);transform:translateY(-2px) scale(1.05)}
nav.tabs a.on::before{filter:saturate(2.6) brightness(.8) drop-shadow(0 3px 5px rgba(60,100,200,.4))}

section{padding:36px 0 6px;position:relative;scroll-margin-top:52px}
h2{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.08em;margin:0 0 16px;color:var(--blue);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:34px;height:26px;background:url(../assets/cloud.svg) center/contain no-repeat;flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(91,139,224,.3))}
.card{position:relative;background:rgba(255,255,255,.94);border-radius:20px;padding:22px 20px 20px;box-shadow:0 8px 24px rgba(91,139,224,.14);border:1px solid #d8ecf8}
.card::before{content:"";position:absolute;left:20px;right:20px;top:-7px;height:14px;background:radial-gradient(circle at 50% 50%,#fff 0 4px,#cfe4f7 4.5px 5.5px,transparent 6px) 0 0/16px 14px repeat-x;pointer-events:none}
.sample{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0;background:#fff1f6;color:#d9558a;border-radius:999px;padding:0 9px;margin-left:2px}

/* profile */
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;padding-top:14px;border-top:2px dotted #d9ecf8}
.facts dt{font-weight:700;color:var(--blue)}
.facts dd{margin:0}
.sns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.sns a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;padding:12px 6px;border-radius:14px;background:linear-gradient(180deg,#f3faff,var(--mist));color:var(--ink);font-weight:700;font-size:14px;border:1.5px solid #d4ebf8;transition:transform .15s,border-color .15s}
.sns a:hover{border-color:var(--sky);transform:translateY(-2px)}
.sns small{font-weight:500;font-size:11px;color:#6f8db8}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:12px;padding:11px 0;border-bottom:2px dotted #d9ecf8}
.list li:last-child{border-bottom:0}
.list time{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--blue);min-width:3.6em;font-variant-numeric:tabular-nums}
.week{display:grid;gap:8px}
.day{display:grid;grid-template-columns:2.6em 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--mist)}
.day b{font-weight:700;font-size:16px;color:var(--blue);text-align:center}
.day.off{opacity:.55}
.day .t{font-variant-numeric:tabular-nums;font-weight:700}

/* songs */
.search{width:100%;padding:12px 16px;border-radius:999px;border:2px solid #cfe7f6;font:inherit;background:var(--mist);color:var(--ink)}
.songs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;max-height:310px;overflow-y:auto}
.songs li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--mist)}
.songs .tt{font-weight:700;line-height:1.4}
.songs .ar{font-size:12px;color:#6f8db8}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 18px;background:var(--blue);color:var(--white);cursor:pointer;box-shadow:0 3px 0 #3f68b8}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3f68b8}
.btn.small{padding:5px 14px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
.btn.pink{background:var(--pink);box-shadow:0 3px 0 #e07aa3}
.btn.ghost{background:var(--mist);color:var(--blue);box-shadow:none;border:2px solid #cfe7f6}
.note{font-size:13px;color:#6f8db8;margin:10px 0 0}
.toast{margin-top:12px;padding:10px 14px;border-radius:14px;background:#fff7e8;border:2px solid #ffe2a8;font-size:14px;display:none}
.toast.show{display:block}

/* forms */
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=password],textarea{width:100%;padding:12px 14px;border-radius:14px;border:2px solid #cfe7f6;font:inherit;background:var(--mist);color:var(--ink)}
textarea{min-height:110px;resize:vertical}

/* rules */
details{border-radius:14px;background:var(--mist);margin-top:8px;overflow:hidden}
details summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";color:var(--pink);font-weight:700;font-size:20px;line-height:1;width:1em}
details[open] summary::before{content:"−"}
details p{margin:0;padding:0 16px 14px 42px;font-size:14px}

/* omikuji / stamp */
.omikuji{text-align:center}
.omikuji .result{min-height:104px;margin:14px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.omikuji .rank{font-weight:700;font-size:30px;letter-spacing:.1em;color:var(--pink);text-shadow:0 2px 0 #ffd7e6}
.shake{animation:shake .6s ease}
@keyframes shake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}

.omicard{width:100%;max-width:300px;margin:0 auto;padding:16px 14px;border-radius:20px;background:linear-gradient(180deg,#fff,#eef7ff);border:2px solid #cfe6fb;box-shadow:0 6px 16px rgba(91,139,224,.15)}
.omicard small{display:block;font-size:11px;letter-spacing:.12em;color:#7aa3d6}
.omicard.gold{background:linear-gradient(135deg,#fff8dc,#ffe7a8,#fff8dc);border-color:#f2d27a}
.omicard.rare{background:linear-gradient(135deg,#ffe3f0,#e4f0ff,#e6ffe9,#fff4d6);border-color:#d8c4f5}
.omicard p{margin:6px 0 10px;font-size:14px;line-height:1.7}
.omicard .lucky{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:11px;color:#6b86b0}
.omicard .lucky span{background:#fff;border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.omicard .lucky b{font-size:13px;color:#3d5f96}
.omicard .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1px solid #cfe0f3}
.omicard .share{margin-top:12px;font:inherit;font-size:13px;font-weight:700;color:#fff;background:#1d2b4a;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
.omikuji .again{font-size:12px;color:#7aa3d6;margin-top:6px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.stamp{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--mist);border:3px dashed #bfdff2;font-size:12px;color:#8ab0d2;font-weight:700}
.stamp.on{background:#fff;border:3px solid var(--sky);box-shadow:inset 0 0 0 3px #eaf6fd}
.stamp.on i{width:78%;height:78%;background:url(../assets/cloud.svg) center/contain no-repeat;animation:pop .5s ease both}
.prize{margin-top:10px;font-size:14px}

/* pages */
.page{display:none}
.page.on{display:block;animation:pageIn .45s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body:not([data-route="home"]) #hero{display:none}
.minihead{display:none;text-align:center;padding:18px 0 0;position:relative;z-index:2}
body:not([data-route="home"]) .minihead{display:block}
.minihead img{width:min(230px,62%);height:auto;filter:drop-shadow(0 3px 8px rgba(70,110,190,.2))}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt{display:block;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.94);border:1px solid #d8ecf8;border-radius:18px;padding:16px 14px 14px;box-shadow:0 6px 18px rgba(91,139,224,.12);position:relative;overflow:hidden;transition:transform .15s}
.mt:active{transform:scale(.97)}
.mt b{display:block;font-size:16px;color:var(--blue);letter-spacing:.04em}
.mt span{display:block;font-size:12px;color:#6f8db8;margin-top:2px;line-height:1.5;padding-right:6px}.mt span i{font-style:normal;display:inline-block}
.home-news{margin-top:20px}
/* motion */
.rv{animation:rv .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rv{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-10px) rotate(1.2deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 4px 10px rgba(70,110,190,.22))}50%{filter:drop-shadow(0 4px 18px rgba(255,255,255,.95))}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
@keyframes wig{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(9deg)}}
@keyframes hop{0%{transform:scale(1)}30%{transform:scale(1.07,.94)}60%{transform:scale(.97,1.05) translateY(-14px)}100%{transform:scale(1)}}
@keyframes reveal{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes shoot{0%{transform:translate(0,0) rotate(-28deg);opacity:0}3%{opacity:1}12%{transform:translate(-210px,112px) rotate(-28deg);opacity:0}100%{transform:translate(-210px,112px) rotate(-28deg);opacity:0}}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(200deg);opacity:0}}
.shoot{position:absolute;left:78%;top:22px;width:96px;height:2px;border-radius:2px;background:linear-gradient(270deg,transparent,#fff);box-shadow:0 0 8px #fff;opacity:0;animation:shoot 8s linear 2s infinite;pointer-events:none}
.shoot.b{left:92%;top:150px;animation-delay:6s;width:70px}
.cloud{animation:drift 14s ease-in-out infinite}
.cloud+.cloud{animation-duration:18s;animation-direction:reverse}
h2::before{animation:wig 6s ease-in-out infinite;transform-origin:center}
.pt{position:fixed;z-index:70;width:var(--sz,12px);height:var(--sz,12px);pointer-events:none;background:var(--c,#fff);margin:-6px 0 0 -6px;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:pt var(--t,.9s) ease-out forwards;filter:drop-shadow(0 0 3px rgba(91,139,224,.6))}
.char{cursor:pointer;-webkit-tap-highlight-color:transparent}
.char.hop{animation:hop .6s ease}
.reveal{animation:reveal .55s cubic-bezier(.2,1.4,.4,1) both}
.ted.shake{animation:shake .6s ease infinite}
/* cute clouds */
.sky{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.cl2{position:absolute;left:0;top:var(--y);width:var(--w);animation:cross var(--d) linear var(--dl) infinite}
.cl2 img{display:block;width:100%;opacity:var(--o,.95);pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:cbob 4.2s ease-in-out var(--b,0s) infinite alternate;transform-origin:50% 90%}
.cl2 img.pop{animation:cpop .65s ease}
@keyframes cross{from{transform:translateX(-240px)}to{transform:translateX(calc(100vw + 20px))}}
@keyframes cbob{from{transform:translateY(-7px) scale(1,1)}to{transform:translateY(8px) scale(1.05,.95)}}

      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!(r>=1&&r<=10)){ show($('#cToast2'),'日付と順位(1〜10位)をご確認ください'); return; }
      data.cal[d]={r:r,e:$('#cev').value.trim(),m:$('#cms').value.trim()}; save(); vCal(); show($('#cToast2'),'記録しました。');
    });
    body.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click',function(){ delete data.cal[b.dataset.del]; save(); vCal(); }); });
  }
  function vEma(){
    body.innerHTML='<div class="card"><p class="note" style="margin-top:0">読み込んでいます…</p></div>'+demoNote();
    if(mode!=='server'){ body.innerHTML='<div class="card"><p class="note" style="margin:0">合言葉でログインした状態でご利用いただけます。</p></div>'; return; }
    rpc('michamaru_ema_list',{p_pass:getPass()}).then(function(l){
      l=l||[];
      var h='<div class="card"><p class="note" style="margin-top:0">届いた願い事です。「公開」にしたものだけ、HPの絵馬掛けに並びます(最新の60件まで)。</p></div><div class="card" style="margin-top:12px">';
      h+= l.length? l.map(function(x){ return '<div class="arow"><b style="font-size:12px">'+(x.k==='together'?'一緒に':'自分')+'</b><div class="grow">'+esc(x.b)+'</div><button class="btn small '+(x.a?'':'ghost')+'" data-set="'+x.id+'" data-a="'+(x.a?0:1)+'" type="button">'+(x.a?'公開中':'公開する')+'</button><button class="btn small ghost" data-rm="'+x.id+'" type="button">削除</button></div>'; }).join('') : '<p class="note" style="margin:0">まだ届いていません。</p>';
      body.innerHTML=h+'</div><div class="toast" id="eToast" role="status"></div>';
      body.querySelectorAll('[data-set]').forEach(function(b){ b.addEventListener('click',function(){ rpc('michamaru_ema_set',{p_pass:getPass(),p_id:+b.dataset.set,p_approved:b.dataset.a==='1'}).then(vEma).catch(function(){ show($('#eToast'),'更新できませんでした'); }); }); });
      body.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click',function(){ rpc('michamaru_ema_del',{p_pass:getPass(),p_id:+b.dataset.rm}).then(vEma).catch(function(){ show($('#eToast'),'削除できませんでした'); }); }); });
    }).catch(function(){ body.innerHTML='<div class="card"><p class="note" style="margin:0">読み込めませんでした。追加の設定(SQL)がまだの場合は、完了後にご確認ください。</p></div>'; });
  }
  function vVisit(){
    body.innerHTML='<div class="card"><p class="note" style="margin-top:0">2026年11/23 0時から、端末ごとに1人として数えています。更新ページを使っている端末は、数えません。</p><p id="vN" style="font-size:28px;font-weight:700;color:var(--blue);text-align:center;margin:12px 0">…</p></div>';
    rpc('michamaru_visit',{p_new:false}).then(function(d){ $('#vN').textContent= d&&d.started ? Number(d.n).toLocaleString('ja-JP')+'人' : '11/23から数え始めます'; }).catch(function(){ $('#vN').textContent='読み込めませんでした'; });
  }
  function vInbox(){
    body.innerHTML='<div class="card"><p class="note" style="margin:0">読み込んでいます…</p></div>';
    if(mode!=='server'){ body.innerHTML='<div class="card"><p class="note" style="margin:0">合言葉でログインした状態でご利用いただけます。</p></div>'; return; }
    rpc('michamaru_inbox_list',{p_pass:getPass()}).then(function(l){
      l=l||[];
      var h='<div class="card"><p class="note" style="margin-top:0">届いた匿名メッセージと、歌ってほしい曲のリクエストです。新しい順に並びます。</p></div><div class="card" style="margin-top:12px">';
      h+= l.length? l.map(function(x){
        var d=new Date(x.at), dt=(d.getMonth()+1)+'/'+d.getDate();
        var main= x.k==='request' ? '<b>'+esc(x.t||'')+'</b>'+(x.a?' / '+esc(x.a):'')+(x.b?'<br><small>'+esc(x.b)+'</small>':'') : esc(x.b||'');
        return '<div class="arow"><b style="font-size:12px">'+(x.k==='request'?'リクエスト':'メッセージ')+'<br>'+dt+'</b><div class="grow">'+main+'</div><button class="btn small ghost" data-rm="'+x.id+'" type="button">削除</button></div>';
      }).join('') : '<p class="note" style="margin:0">まだ届いていません。</p>';
      body.innerHTML=h+'</div><div class="toast" id="iToast" role="status"></div>';
      body.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click',function(){ rpc('michamaru_inbox_del',{p_pass:getPass(),p_id:+b.dataset.rm}).then(vInbox).catch(function(){ show($('#iToast'),'削除できませんでした'); }); }); });
    }).catch(function(){ body.innerHTML='<div class="card"><p class="note" style="margin:0">読み込めませんでした。時間をおいて、もう一度お試しください。</p></div>'; });
  }
  openAd();
})();
</script>
<div id="updBar" role="status"><b>新しいバージョンがあります。<br>更新すると、最新の画面になります。</b><button type="button" id="updGo">更新する</button><button type="button" class="x" id="updX" aria-label="閉じる">✕</button></div>
<script>
(function(){
  var m=document.querySelector('meta[name="meta-build"]'); if(!m) return;
  var cur=m.content, shown=false;
  function bar(){ var b=document.getElementById('updBar'); if(!b||shown) return; shown=true; b.classList.add('on');
    document.getElementById('updGo').onclick=function(){ location.reload(); };
    document.getElementById('updX').onclick=function(){ b.classList.remove('on'); }; }
  function check(){
    try{ fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).then(function(j){ if(j&&j.build&&String(j.build)!==cur) bar(); }).catch(function(){}); }catch(e){}
  }
  setTimeout(check,3000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(); });
  setInterval(check,300000);
})();
</script>
